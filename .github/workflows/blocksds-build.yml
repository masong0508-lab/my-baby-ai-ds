name: DraStic alternate-runtime ROM build

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One full ARM9+ARM7 build, packaging and DeSmuME walkthrough per current
# pull-request revision. Superseded commits should not keep expensive
# emulator jobs queued while the player waits for the latest ROM.
concurrency:
  group: baby-ai-blocksds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blocksds:
    name: Build original DS ROM with BlocksDS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and source check
        shell: bash
        run: |
          set -euxo pipefail
          test -f "${BLOCKSDS:-/opt/blocksds/core}/sys/crts/ds_arm9.specs"
          make --version
      - name: Build full game with independent ARM7 and ARM9 runtime
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.blocksds clean NAME=my-baby-ai-blocksds
          make -f Makefile.blocksds -j2 NAME=my-baby-ai-blocksds
          test -s my-baby-ai-blocksds.nds
      - name: Build independent color-screen boot probe
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.blocksds -j2 SOURCEDIRS=diagnostics NAME=blocksds-dual-screen-test
          test -s blocksds-dual-screen-test.nds
      - name: Build independent stylus and KEY_TOUCH probe
        shell: bash
        run: |
          set -euxo pipefail
          make -f Makefile.blocksds -j2 SOURCEDIRS=diagnostics/touch NAME=blocksds-touch-probe
          test -s blocksds-touch-probe.nds
      - name: Compare alternative ARM7 touchscreen runtimes
        shell: bash
        run: |
          set -euxo pipefail
          # Same ARM9 source and SDK, but a smaller built-in ARM7 core.
          # BlocksDS documents that this core still includes basic libnds
          # services, including touchscreen reporting.
          test -f "${BLOCKSDS:-/opt/blocksds/core}/sys/arm7/main_core/arm7_minimal.elf"
          make -f Makefile.blocksds -j2 SOURCEDIRS=diagnostics/touch NAME=blocksds-touch-probe-minimal-arm7 ARM7ELF="${BLOCKSDS:-/opt/blocksds/core}/sys/arm7/main_core/arm7_minimal.elf"
          make -f Makefile.blocksds -j2 NAME=my-baby-ai-blocksds-minimal-arm7 ARM7ELF="${BLOCKSDS:-/opt/blocksds/core}/sys/arm7/main_core/arm7_minimal.elf"
          test -s blocksds-touch-probe-minimal-arm7.nds
          test -s my-baby-ai-blocksds-minimal-arm7.nds
      - name: Validate all dual-CPU ROM packages
        shell: bash
        run: |
          set -euxo pipefail
          test -s my-baby-ai-blocksds.nds
          test -s blocksds-dual-screen-test.nds
          test -s blocksds-touch-probe.nds
          test -s blocksds-touch-probe-minimal-arm7.nds
          test -s my-baby-ai-blocksds-minimal-arm7.nds
          ${BLOCKSDS:-/opt/blocksds/core}/tools/ndstool/ndstool -i blocksds-touch-probe-minimal-arm7.nds
          ${BLOCKSDS:-/opt/blocksds/core}/tools/ndstool/ndstool -i my-baby-ai-blocksds-minimal-arm7.nds
          ${BLOCKSDS:-/opt/blocksds/core}/tools/ndstool/ndstool -i blocksds-touch-probe.nds
          ${BLOCKSDS:-/opt/blocksds/core}/tools/ndstool/ndstool -i my-baby-ai-blocksds.nds
          ${BLOCKSDS:-/opt/blocksds/core}/tools/ndstool/ndstool -i blocksds-dual-screen-test.nds
      - name: Upload BlocksDS game and minimal diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: my-baby-ai-blocksds-drastic-test
          path: |
            my-baby-ai-blocksds.nds
            blocksds-dual-screen-test.nds
            blocksds-touch-probe.nds
            blocksds-touch-probe-minimal-arm7.nds
            my-baby-ai-blocksds-minimal-arm7.nds
          if-no-files-found: error
          retention-days: 30

  ds-only-packaging:
    name: Publish DS-only variants for legacy emulators
    needs: blocksds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve independent BlocksDS runtime binaries
        uses: actions/download-artifact@v4
        with:
          name: my-baby-ai-blocksds-drastic-test
      - name: Correct unit code and CRC without changing either ARM program
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/nds_legacy_header.py my-baby-ai-blocksds.nds my-baby-ai-blocksds-ds-only.nds
          python3 tools/nds_legacy_header.py blocksds-dual-screen-test.nds blocksds-dual-screen-test-ds-only.nds
          python3 tools/nds_legacy_header.py blocksds-touch-probe.nds blocksds-touch-probe-ds-only.nds
          python3 tools/nds_legacy_header.py blocksds-touch-probe-minimal-arm7.nds blocksds-touch-probe-minimal-arm7-ds-only.nds
          python3 tools/nds_legacy_header.py my-baby-ai-blocksds-minimal-arm7.nds my-baby-ai-blocksds-minimal-arm7-ds-only.nds
          python3 tools/nds_plain_homebrew.py my-baby-ai-blocksds-ds-only.nds my-baby-ai-blocksds-plain.nds
          python3 tools/nds_plain_homebrew.py my-baby-ai-blocksds-minimal-arm7-ds-only.nds my-baby-ai-blocksds-minimal-arm7-plain.nds
          python3 - <<'PY'
          from pathlib import Path
          from sys import path
          path.insert(0, "tools")
          from nds_legacy_header import crc16
          from nds_plain_homebrew import create_plain, u32
          for name in ('my-baby-ai-blocksds', 'my-baby-ai-blocksds-minimal-arm7'):
              original = Path(name + '-ds-only.nds').read_bytes()
              plain = Path(name + '-plain.nds').read_bytes()
              assert plain == create_plain(original), name
              assert u32(plain, 0x20) == 0x1000 and plain[0x12] == 0
              assert plain[u32(original, 0x30):] == original[u32(original, 0x30):]
              print(name, 'homebrew offset verified; no encrypted secure area; ARM7/FAT unchanged')
          for filename in ("my-baby-ai-blocksds","blocksds-dual-screen-test","blocksds-touch-probe","blocksds-touch-probe-minimal-arm7","my-baby-ai-blocksds-minimal-arm7"):
              a=Path(filename+".nds").read_bytes()
              b=Path(filename+"-ds-only.nds").read_bytes()
              assert b[0x12]==0 and a[0x160:]==b[0x160:], filename
              if filename.startswith("my-baby-ai-"):
                  assert a[:12]==b"MY BABY A.I.", (filename, "title")
                  assert a[0x0c:0x10]==b"MBAI", (filename, "gamecode")
                  assert b[:12]==a[:12] and b[0x0c:0x10]==a[0x0c:0x10]
              assert crc16(b[:0x15e])==int.from_bytes(b[0x15e:0x160],"little")
              print(filename, "DS-only header verified; ARM program untouched")
          PY
      - name: Upload BlocksDS complete legacy-compatibility set
        uses: actions/upload-artifact@v4
        with:
          name: my-baby-ai-blocksds-legacy-compat
          path: |
            my-baby-ai-blocksds.nds
            my-baby-ai-blocksds-ds-only.nds
            blocksds-dual-screen-test.nds
            blocksds-dual-screen-test-ds-only.nds
            blocksds-touch-probe.nds
            blocksds-touch-probe-ds-only.nds
            blocksds-touch-probe-minimal-arm7.nds
            blocksds-touch-probe-minimal-arm7-ds-only.nds
            my-baby-ai-blocksds-minimal-arm7.nds
            my-baby-ai-blocksds-minimal-arm7-ds-only.nds
            my-baby-ai-blocksds-plain.nds
            my-baby-ai-blocksds-minimal-arm7-plain.nds
          if-no-files-found: error
          retention-days: 30

  desmume-touch:
    name: Emulate native stylus and assert ROM touchscreen signals
    needs: ds-only-packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact ROMs built in this run
        uses: actions/download-artifact@v4
        with:
          name: my-baby-ai-blocksds-legacy-compat
      - name: Configure Python test harness
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual DeSmuME emulator and screenshot backend
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check py-desmume==0.0.9 Pillow
      - name: Boot both ROMs, inject stylus coordinates and assert visible updates
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          timeout 160 python tests/emulator_touch.py \
            blocksds-touch-probe-ds-only.nds \
            my-baby-ai-blocksds-ds-only.nds \
            --output emulator-proof --stage probe
          timeout 160 python tests/emulator_touch.py \
            blocksds-touch-probe-ds-only.nds \
            my-baby-ai-blocksds-ds-only.nds \
            --output emulator-proof --stage game
          # Real CPU/stylus/3D boot test of the anti-encryption layout
          timeout 160 python tests/emulator_touch.py \
            blocksds-touch-probe-ds-only.nds \
            my-baby-ai-blocksds-plain.nds \
            --output emulator-plain-proof --stage game
      - name: Upload captured emulator screens and result even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-native-touch-evidence
          path: |
            emulator-proof/
            emulator-plain-proof/
          retention-days: 30
          if-no-files-found: warn

  desmume-arcade:
    name: Play native arcade retries and earn the Cereal unlock
    needs: ds-only-packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the production ROM built in this run
        uses: actions/download-artifact@v4
        with:
          name: my-baby-ai-blocksds-legacy-compat
      - name: Configure Python test harness
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual DeSmuME emulator and screenshot backend
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check py-desmume==0.0.9 Pillow
      - name: Play visible puzzles using native stylus and keypad controls
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          timeout 240 python tests/emulator_arcade.py \
            my-baby-ai-blocksds-ds-only.nds \
            --output emulator-arcade-proof
      - name: Upload native arcade screens and results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-native-arcade-evidence
          path: emulator-arcade-proof/
          retention-days: 30
          if-no-files-found: warn

  desmume-starters:
