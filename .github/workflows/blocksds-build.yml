      - name: Play the four remaining starter cabinets through native controls
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          timeout 240 python tests/emulator_arcade_motion.py \
            my-baby-ai-blocksds-ds-only.nds \
            --output emulator-starter-proof
      - name: Upload native starter screens and results even on failure
        if: always()
