        with:
          name: desmume-native-starter-evidence
          path: emulator-starter-proof/
          retention-days: 30
          if-no-files-found: warn

  desmume-conversation:
    name: Converse with the baby through native touch and buttons
    needs: ds-only-packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
