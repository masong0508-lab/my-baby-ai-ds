          SDL_AUDIODRIVER: dummy
        run: |
          set -euxo pipefail
          timeout 240 python tests/emulator_conversation.py \
            my-baby-ai-blocksds-ds-only.nds \
            --output emulator-conversation-proof
      - name: Upload native conversation screens and results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desmume-native-conversation-evidence
          path: emulator-conversation-proof/
          retention-days: 30
          if-no-files-found: warn

  desmume-observer:
