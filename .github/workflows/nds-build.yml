name: Build Nintendo DS ROM

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-rom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-sanitizers:
    name: Check original C game engine under ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This same tests/run.sh list also runs in the devkitARM container
      # without these optional flags. Test sets cannot silently diverge.
      MBAI_HOST_CC: cc
      MBAI_HOST_FLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Check out identical tested game revision
        uses: actions/checkout@v4
      - name: Check native sanitizer availability
        shell: bash
        run: |
          set -euxo pipefail
          cc --version
          python3 --version
      - name: Exercise game, UI, graphics, input and save stress under sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          sh tests/run.sh

  test-and-build:
    name: Compile My Baby A.I. (.nds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Install and verify DS SDK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$PATH"
          dkp-pacman -S --needed --noconfirm nds-dev
          command -v arm-none-eabi-gcc
          test -f "$DEVKITARM/ds_rules"
          test -f "$DEVKITPRO/libnds/include/nds.h"
          arm-none-eabi-gcc --version

      - name: Run host-side tests before generating ROM
        shell: bash
        run: |
          set -euxo pipefail
          make --version
          sh tests/run.sh

      - name: Clean build using repository Makefile
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$PATH"
          make clean
          make -j2
          test -s my-baby-ai.nds

      - name: Validate and describe ROM
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$PATH"
          ls -lh my-baby-ai.nds my-baby-ai.elf
          ndstool -i my-baby-ai.nds
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("my-baby-ai.nds").read_bytes()
          assert len(rom) >= 0x200, "NDS header is missing"
          assert rom[:12] == b"MY BABY A.I.", "Wrong cartridge title"
          assert rom[12:16] == b"MBAI", "Wrong cartridge game code"
          arm9_offset = int.from_bytes(rom[0x20:0x24], "little")
          arm9_size = int.from_bytes(rom[0x2C:0x30], "little")
          assert arm9_offset >= 0x200 and arm9_size > 0, "No ARM9 program"
          assert arm9_offset + arm9_size <= len(rom), "Truncated ARM9 data"
          print(f"ROM size={len(rom):,} bytes, ARM9 offset={arm9_offset:#x}, ARM9 bytes={arm9_size:,}")
          PY

      - name: Package legacy DS-only compatibility ROM
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/nds_legacy_header.py my-baby-ai.nds my-baby-ai-ds-only.nds
          test -s my-baby-ai-ds-only.nds
          ndstool -i my-baby-ai-ds-only.nds

      - name: Build bare-metal ARM7 native touch comparison ROM
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          sh tools/build_bare_touch_probe.sh bare-touch-arm7.nds
          test -s bare-touch-arm7.nds
          ndstool -i bare-touch-arm7.nds

      - name: Upload independent Mandex-style ARM7 touch probe
        uses: actions/upload-artifact@v4
        with:
          name: my-baby-ai-bare-arm7-touch-probe
          path: bare-touch-arm7.nds
          if-no-files-found: error
          retention-days: 30

      - name: Upload standard and DS-only homebrew ROMs
        uses: actions/upload-artifact@v4
        with:
          name: my-baby-ai-nds
          path: |
            my-baby-ai.nds
            my-baby-ai-ds-only.nds
          if-no-files-found: error
          retention-days: 30
